<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALYE LUMA — Point of Sale / Search / Receipt Modules</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-mark"><span class="dot"></span><span>KALYE LUMA CASHIER SYSTEM</span></div>
    <h1>KALYE LUMA</h1>
    <div class="sub">Sign in to open the register.</div>
    <form id="loginForm">
      <div class="field">
        <label for="loginUser">Username</label>
        <input type="text" id="loginUser" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <div class="pw-wrap">
          <input type="password" id="loginPass" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" data-target="loginPass" aria-label="Show password">Show</button>
        </div>
      </div>
      <button type="submit" class="btn block">Log in</button>
      <div class="login-error" id="loginError"></div>
    </form>
    <div class="login-hint">Demo account: <strong>cashier</strong> / <strong>cashier123</strong></div>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="dot"></span>
      <div class="brand-text">Kalye Luma POS<small>CASHIER REGISTER SYSTEM</small></div>
    </div>
    <nav class="nav" id="navLinks">
      <button class="nav-link active" data-view="pos"><span class="ico">▤</span>Point of Sale</button>
    </nav>
    <div class="sidebar-foot">
      <div class="user-chip"><span class="avatar" id="userAvatar">A</span><span id="userLabel">—</span></div>
      <button class="btn ghost small" style="width:100%;color:#EDE7D2;border-color:rgba(237,231,210,0.3);margin-bottom:8px;" id="resetDataBtn">Restock all (10)</button>
      <button class="btn ghost small" style="width:100%;color:#EDE7D2;border-color:rgba(237,231,210,0.3);" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main">

    <section class="view active" id="view-pos">
      <div class="topbar">
        <div><h2>Point of Sale</h2><div class="meta">Tap a product to add it to the current order.</div></div>
      </div>
      <div class="toolbar">
        <div class="pill-tabs" id="posCatTabs">
          <button class="pill-tab active" data-cat="food">Food &amp; Drinks</button>
          <button class="pill-tab" data-cat="game">Board Games / Cards</button>
        </div>
        <input type="text" id="posSearch" placeholder="Search products…">
      </div>
      <div class="pos-layout">
        <div class="product-grid" id="posGrid"></div>
        <aside class="cart">
          <div class="cart-head"><h3>Current order</h3><button class="btn ghost small" id="clearCartBtn">Clear</button></div>
          <div class="cart-items" id="cartItems"></div>
          <div class="cart-summary">
            <div class="discount-row">
              <select id="discountType">
                <option value="none">No discount</option>
                <option value="percent">Percent %</option>
                <option value="amount">Amount ₱</option>
                <option value="senior">Senior/PWD 20%</option>
              </select>
              <input type="number" id="discountValue" placeholder="0" min="0" disabled>
            </div>
            <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">₱0.00</span></div>
            <div class="summary-row"><span>Discount</span><span id="sumDiscount">-₱0.00</span></div>
            <div class="pay-methods">
              <button class="pay-method active" data-pay="Cash">Cash</button>
              <button class="pay-method" data-pay="Card">Card</button>
              <button class="pay-method" data-pay="GCash">GCash / QR</button>
            </div>
            <div class="summary-row total"><span>Total</span><span id="sumTotal">₱0.00</span></div>
            <button class="btn block" id="checkoutBtn">Complete payment</button>
          </div>
        </aside>
      </div>
    </section>

  </main>
</div>

<div class="modal-backdrop" id="receiptModal">
  <div class="modal">
    <div class="modal-head"><h3>Receipt</h3><button class="modal-close" data-close="receiptModal">×</button></div>
    <div class="modal-body"><div class="receipt" id="receiptContent"></div></div>
    <div class="modal-foot">
      <button class="btn ghost" data-close="receiptModal">Close</button>
      <button class="btn subtle" id="printReceiptBtn">🖨 Print receipt</button>
      <button class="btn" id="newOrderBtn">Start new order</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div id="printReceiptArea" class="print-only"></div>

<script src="js/shared.js"></script>
<script src="js/search.js"></script>
<script src="js/pos.js"></script>
<script src="js/receipt.js"></script>
</body>
</html>
